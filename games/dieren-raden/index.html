<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Welk dier klopt niet?</title>
<style>
  :root { --ink: #3a2e5c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #fff6e0; color: var(--ink);
    overscroll-behavior: none; touch-action: manipulation;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: ui-rounded, "Nunito", system-ui, sans-serif;
  }
  main {
    height: 100dvh; display: flex; flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    max-width: 720px; margin: 0 auto;
  }
  .listen { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
  .answer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .divider { text-align: center; }
  .divider hr { border: 0; height: 4px; border-radius: 2px; background: rgb(58 46 92 / .25); margin: 2px 0 8px; }
  .divider p { margin: 0; font-size: clamp(16px, 5vw, 26px); font-weight: 800; line-height: 1.2; }
  button { font: inherit; color: inherit; border: 0; padding: 0; cursor: pointer; }
  .tile, .ans {
    position: relative; background: var(--c); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 .8vmin 0 rgb(0 0 0 / .15); transition: transform .1s, box-shadow .1s, filter .3s;
  }
  .tile { border-radius: 28px; font-size: min(30vw, 17dvh); line-height: 1; }
  .ans { border-radius: 22px; aspect-ratio: 1; font-size: min(13vw, 9dvh); line-height: 1; }
  .tile:active, .ans:active { transform: translateY(.6vmin); box-shadow: 0 .2vmin 0 rgb(0 0 0 / .15); }
  .tile.play { animation: bounce .45s; }
  .grey { filter: grayscale(1) brightness(.9); opacity: .6; }
  .ans.grey { pointer-events: none; animation: shake .4s; }
  .ans.right { background: #7be08a; box-shadow: 0 .8vmin 0 #3fa84f; }
  .badge {
    position: absolute; right: 6%; bottom: 6%; width: 36%; aspect-ratio: 1; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: min(11vw, 6.5dvh); animation: pop .4s;
  }
  @keyframes bounce { 30% { transform: scale(1.1) rotate(-4deg); } 60% { transform: scale(.96) rotate(3deg); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes pop { from { transform: scale(0); } }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vmin; background: rgb(255 246 224 / .97); text-align: center;
  }
  .overlay.hidden { display: none; }
  .icons { font-size: min(14vmin, 90px); letter-spacing: 1vmin; }
  #start {
    width: min(34vmin, 190px); height: min(34vmin, 190px); border-radius: 50%; background: #4cc35a; color: #fff;
    font-size: min(18vmin, 100px); padding-left: 1vmin; box-shadow: 0 1.4vmin 0 #2f8f3b; animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  #home {
    position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); z-index: 15;
    width: 44px; height: 44px; border-radius: 50%; background: rgb(255 255 255 / .5); font-size: 22px; opacity: .6; touch-action: none;
  }
  #home::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 4px solid var(--ink); opacity: 0; clip-path: inset(0 100% 0 0); }
  #home.hold::after { opacity: 1; clip-path: inset(0 0 0 0); transition: clip-path .9s linear; }
  @media (orientation: landscape) {
    .listen { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
    .tile { font-size: min(14vw, 28dvh); }
    .ans { aspect-ratio: auto; height: 24dvh; font-size: min(7vw, 14dvh); }
    .divider p { font-size: clamp(14px, 5dvh, 24px); }
  }
  @media (prefers-reduced-motion: reduce) { .tile.play, .ans.grey, .badge, #start { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="listen" id="listen"></div>
  <div class="divider"><hr><p>Welk dier maakt het verkeerde geluid?</p></div>
  <div class="answer" id="answer"></div>
</main>
<canvas id="fx"></canvas>
<button id="home" aria-label="Terug">🏠</button>
<div class="overlay" id="title">
  <div class="icons">🐮🐱🐶</div>
  <button id="start" aria-label="Start">▶</button>
  <div class="icons">🔊</div>
</div>

<script>
'use strict';

const ANIMALS = [
  { id: 'paard', emoji: '🐴', color: '#e6c9a8' },
  { id: 'kikker', emoji: '🐸', color: '#bfe8a0' },
  { id: 'poes', emoji: '🐱', color: '#ffd8b0' },
  { id: 'hond', emoji: '🐶', color: '#f3d3a2' },
  { id: 'vogeltje', emoji: '🐦', color: '#b8e6ff' },
  { id: 'koe', emoji: '🐮', color: '#e7e1ff' },
  { id: 'varken', emoji: '🐷', color: '#ffc7da' },
  { id: 'geit', emoji: '🐐', color: '#f4eccf' },
  { id: 'olifant', emoji: '🐘', color: '#cfe8d6' },
  { id: 'kip', emoji: '🐔', color: '#ffe48a' },
  { id: 'slang', emoji: '🐍', color: '#c4f0a8' },
  { id: 'leeuw', emoji: '🦁', color: '#ffd37a' },
  { id: 'aap', emoji: '🐵', color: '#e8c3a0' },
];
const byId = Object.fromEntries(ANIMALS.map(a => [a.id, a]));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

// ---------- geluid ----------
let AC = null, master = null, bus = null, playToken = 0;
const samples = {};            // dier -> [AudioBuffer]  (opnames uit geluiden/manifest.json)

function initAudio() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.gain.value = .8;
    master.connect(comp); comp.connect(AC.destination); newBus();
    AC.resume();
    // iOS: stil audio-element, zodat het geluid ook klinkt met de stilteknop aan
    const a = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAAA');
    a.loop = true; a.play().catch(() => {});
    loadSamples();
  } catch (e) { AC = null; }
}
const sampleReady = {};        // dier -> belofte die klaar is als de opnames gedecodeerd zijn
const decode = buf => new Promise((res, rej) => { const p = AC.decodeAudioData(buf, res, rej); if (p && p.catch) p.catch(rej); });   // werkt ook op oudere Safari
function warn(msg) {
  let w = document.getElementById('warn');
  if (!w) { w = document.createElement('div'); w.id = 'warn'; w.style.cssText = 'position:fixed;left:6px;bottom:2px;font:11px system-ui;color:#c00;z-index:20;pointer-events:none'; document.body.appendChild(w); }
  w.textContent = '⚠ ' + msg;
}
async function loadSamples() {
  try {
    const r = await fetch('geluiden/manifest.json'); if (!r.ok) throw new Error('manifest ' + r.status);
    const m = await r.json(), fails = [];
    await Promise.all(Object.entries(m).map(([id, files]) => sampleReady[id] = Promise.all(files.map(async f => {
      try { const rr = await fetch('geluiden/' + f); if (!rr.ok) throw new Error(rr.status); return await decode(await rr.arrayBuffer()); }
      catch (e) { fails.push(f + ': ' + (e && e.message || e)); return null; }
    })).then(bufs => { samples[id] = bufs.filter(Boolean); })));
    if (fails.length) warn('opnames niet geladen (' + fails.length + '): ' + fails[0]);
  } catch (e) { warn('geen opnames: ' + (e && e.message || e)); }
}

const MAX_CLIP = 3.5;          // lange opnames worden na zoveel seconden uitgefaded
function newBus() { bus = AC.createGain(); bus.connect(master); }
// Alles wat nu klinkt (opnames) direct afkappen; wat nog moet gaan klinken vervalt.
function stopAll() {
  playToken++;
  if (!AC || !bus) return;
  const old = bus; old.gain.cancelScheduledValues(AC.currentTime); old.gain.setTargetAtTime(0, AC.currentTime, .02);
  setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 400);
  newBus();
}
async function playAnimal(id) {
  if (!AC) return;
  AC.resume();
  stopAll();
  const tok = playToken;
  if (sampleReady[id]) await sampleReady[id];
  if (tok !== playToken) return;
  const s = samples[id];
  if (s && s.length) {
    const src = AC.createBufferSource(), g = AC.createGain(), t = AC.currentTime, buf = pick(s);
    src.buffer = buf; g.gain.setValueAtTime(1, t);
    const len = Math.min(buf.duration, MAX_CLIP);
    if (buf.duration > MAX_CLIP) g.gain.setValueAtTime(1, t + len - .4), g.gain.linearRampToValueAtTime(0, t + len);
    src.connect(g); g.connect(bus); src.start(t); src.stop(t + len + .05);
  }
}
function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
}
const sfx = {
  wrong() { tone(300, 150, .3, .25, 'triangle'); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, .35, .2, 'triangle', i * .12)); },
};

// ---------- spel ----------
const listenEl = document.getElementById('listen'), answerEl = document.getElementById('answer');
const tiles = [], answers = [];
for (let i = 0; i < 4; i++) {
  const t = document.createElement('button'); t.className = 'tile'; t.addEventListener('click', () => playTile(i)); listenEl.appendChild(t); tiles.push(t);
  const a = document.createElement('button'); a.className = 'ans'; a.addEventListener('click', () => answer(i)); answerEl.appendChild(a); answers.push(a);
}
let round = null, prevIds = [], nextTimer = 0, revealTimer = 0;

function newRound() {
  clearTimeout(nextTimer); clearTimeout(revealTimer); stopAll();
  let pool = ANIMALS.filter(a => !prevIds.includes(a.id));
  if (pool.length < 4) pool = ANIMALS;
  const animals = shuffle(pool).slice(0, 4);
  const odd = Math.floor(Math.random() * 4);
  const wrong = pick(ANIMALS.filter(a => !animals.includes(a)));      // geluid van een dier dat er niet bij staat
  round = { animals, odd, wrong, done: false };
  prevIds = animals.map(a => a.id);
  animals.forEach((a, i) => {
    for (const el of [tiles[i], answers[i]]) {
      el.className = el === tiles[i] ? 'tile' : 'ans'; el.style.setProperty('--c', a.color); el.textContent = a.emoji; el.setAttribute('aria-label', a.id);
    }
  });
}
function playTile(i) {
  if (!round) return;
  const el = tiles[i]; el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
  playAnimal(i === round.odd ? round.wrong.id : round.animals[i].id);
}
function answer(i) {
  if (!round || round.done) return;
  if (i !== round.odd) {                          // fout: dit dier wordt grijs
    answers[i].classList.add('grey'); tiles[i].classList.add('grey'); sfx.wrong(); return;
  }
  round.done = true;
  answers[i].classList.add('right');
  const b = document.createElement('div'); b.className = 'badge'; b.textContent = round.wrong.emoji; tiles[i].appendChild(b);
  sfx.win(); confettiBurst();
  revealTimer = setTimeout(() => playAnimal(round.wrong.id), 700);
  nextTimer = setTimeout(newRound, 3200);
}

// ---------- confetti ----------
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
let parts = [], running = false;
function resizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resizeFx); resizeFx();
function confettiBurst() {
  const colors = ['#ff5c5c', '#ffd23f', '#4cc35a', '#4aa8ff', '#c77dff', '#ff9f43'];
  for (let i = 0; i < 140; i++) parts.push({ x: rnd(0, innerWidth), y: rnd(-innerHeight * .3, 0), vx: rnd(-60, 60), vy: rnd(200, 520), r: rnd(0, 6), vr: rnd(-8, 8), w: rnd(8, 14), h: rnd(5, 9), c: pick(colors) });
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(fxLoop); }
}
let last = 0;
function fxLoop(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  fctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); fctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts) { p.vy = Math.min(p.vy + 400 * dt, 480); p.x += (p.vx + Math.sin(p.r * 2) * 50) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fctx.restore(); }
  parts = parts.filter(p => p.y < innerHeight + 30);
  if (parts.length) requestAnimationFrame(fxLoop); else { running = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}

// ---------- start / ouder-knop ----------
function start() { document.getElementById('title').classList.add('hidden'); initAudio(); newRound(); }
document.getElementById('start').addEventListener('click', start);
const home = document.getElementById('home'); let homeTimer = 0;
home.addEventListener('pointerdown', () => { home.classList.add('hold'); homeTimer = setTimeout(() => location.href = '../../index.html', 900); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => home.addEventListener(ev, () => { home.classList.remove('hold'); clearTimeout(homeTimer); }));
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (AC) { if (document.hidden) AC.suspend(); else AC.resume(); } });
newRound();   // achtergrond achter het startscherm

// testmodus: ?auto speelt een paar rondes zelf (fout, dan goed) en logt het resultaat in de titel
if (/[?&]auto/.test(location.search)) {
  document.getElementById('title').classList.add('hidden');
  const log = [];
  for (let r = 0; r < 20; r++) {
    newRound();
    const ok = new Set(round.animals.map(a => a.id)).size === 4 && !round.animals.includes(round.wrong) && round.odd >= 0 && round.odd < 4;
    const wrongI = (round.odd + 1) % 4; answer(wrongI);
    const greyed = answers[wrongI].classList.contains('grey');
    answer(round.odd);
    log.push(ok && greyed && round.done ? 'ok' : 'FOUT');
  }
  clearTimeout(nextTimer); newRound();
  AC = new OfflineAudioContext(1, 44100, 44100); master = AC.createGain(); newBus();
  loadSamples().then(() => {
    const bad = ANIMALS.filter(a => !samples[a.id] || !samples[a.id].length).map(a => a.id);
    log.push('opnames:' + ANIMALS.map(a => a.id + '=' + (samples[a.id] ? samples[a.id].length : 0)).join(' ') + (bad.length ? ' ONTBREEKT:' + bad : ''));
    AC = null; master = null; bus = null; document.title = log.join(',');
  }).catch(e => { document.title = 'TESTFOUT ' + e.message; });
  document.title = log.join(',');
}
</script>
</body>
</html>
